<!-- =================================================================
     APP — single file. Rotas por hash:
       #/            -> Home (admin: lista + criar)
       #/criar       -> Wizard de criação
       #/r/<id>      -> Responder (link público que vai no zap)
       #/r/<id>/<token> -> Responder com link individual (trava 1 por pessoa)
       #/dash/<id>   -> Dashboard (celular)
================================================================= -->

<div id="root" class="min-h-screen"></div>

<!-- Toast -->
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 hidden">
  <div class="bg-cinza-900 text-white text-sm px-4 py-2.5 rounded-pill shadow-pop"></div>
</div>

<script>
/* ====================================================================
   CONFIG
==================================================================== */
const CFG = {
  // Supabase do PDV Nexus (projeto caixinha-botequim). Tabelas prefixo clima_.
  SUPABASE_URL: 'https://kuyhkltbwlkvtgbabscv.supabase.co',
  SUPABASE_KEY: 'sb_publishable_dW-JZ00n74dSLCrznBJ6gw_K8AE1VIq',
  // Edge function de IA (gera perguntas + resumo de sentimento). Deploy = fase 2.
  // Enquanto não existir, o app usa o gerador local (demo nunca quebra).
  EDGE_IA_URL: '', // ex: 'https://kuyhkltbwlkvtgbabscv.supabase.co/functions/v1/clima-ia'
  // MODO DEMO: true = salva no navegador (localStorage), funciona JÁ, sem depender
  // de criar tabela. Trocar pra false quando as tabelas clima_* estiverem criadas.
  MODO_DEMO: false,
};

/* ====================================================================
   CAMADA DE DADOS (DB) — abstrai localStorage vs Supabase.
   Mesma API nos dois modos: o resto do app não sabe qual está ativo.
==================================================================== */
let sb = null;
if (!CFG.MODO_DEMO) {
  try { sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY); }
  catch(e){ console.warn('Supabase off, caindo pro modo demo', e); CFG.MODO_DEMO = true; }
}

const LS = {
  get(k, def){ try{ return JSON.parse(localStorage.getItem('clima_'+k)) ?? def }catch{ return def } },
  set(k, v){ localStorage.setItem('clima_'+k, JSON.stringify(v)) },
};

// IDs simples e tokens (sem libs)
function uid(){ return 'id'+Math.abs(hashStr(navigator.userAgent+performance.now()+Object.keys(localStorage).length+Math.floor(performance.now()*1000))).toString(36) }
function tok(){ let s=''; const a='abcdefghijkmnpqrstuvwxyz23456789'; const seed=Math.floor(performance.now()*1e6); for(let i=0;i<6;i++){ s+=a[(seed>>(i*3))%a.length] } return s+(Object.keys(localStorage).length%97).toString(36) }
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h<<5)-h+s.charCodeAt(i); h|=0 } return h }

const DB = {
  // ---- PESQUISAS ----
  async listarPesquisas(){
    if (CFG.MODO_DEMO) return LS.get('pesquisas', []).sort((a,b)=>b.criado_em-a.criado_em);
    const { data } = await sb.from('clima_pesquisas').select('*').order('criado_em',{ascending:false});
    return data||[];
  },
  async getPesquisa(id){
    if (CFG.MODO_DEMO) return (LS.get('pesquisas',[])).find(p=>p.id===id) || null;
    const { data } = await sb.from('clima_pesquisas').select('*').eq('id',id).single();
    return data||null;
  },
  async salvarPesquisa(p){
    if (CFG.MODO_DEMO){ const arr=LS.get('pesquisas',[]); const i=arr.findIndex(x=>x.id===p.id);
      if(i>=0)arr[i]=p; else arr.push(p); LS.set('pesquisas',arr); return p; }
    const { data } = await sb.from('clima_pesquisas').upsert(p).select().single(); return data;
  },
  // ---- FUNCIONÁRIOS ----
  async listarFuncionarios(empresa){
    if (CFG.MODO_DEMO) return LS.get('func',[]).filter(f=>f.empresa===empresa);
    const { data } = await sb.from('clima_funcionarios').select('*').eq('empresa',empresa).order('nome');
    return data||[];
  },
  async salvarFuncionarios(lista){
    if (CFG.MODO_DEMO){ const arr=LS.get('func',[]);
      lista.forEach(f=>{ const i=arr.findIndex(x=>x.id===f.id); if(i>=0)arr[i]=f; else arr.push(f); });
      LS.set('func',arr); return lista; }
    const { data } = await sb.from('clima_funcionarios').upsert(lista).select(); return data;
  },
  // ---- RESPOSTAS ----
  async jaRespondeu(pesquisaId, funcId){
    if (!funcId) return false;
    if (CFG.MODO_DEMO) return LS.get('resp',[]).some(r=>r.pesquisa_id===pesquisaId && r.func_id===funcId);
    const { data } = await sb.from('clima_respostas').select('id').eq('pesquisa_id',pesquisaId).eq('func_id',funcId);
    return (data||[]).length>0;
  },
  async salvarResposta(r){
    if (CFG.MODO_DEMO){ const arr=LS.get('resp',[]); arr.push(r); LS.set('resp',arr); return r; }
    const { data } = await sb.from('clima_respostas').insert(r).select().single(); return data;
  },
  async listarRespostas(pesquisaId){
    if (CFG.MODO_DEMO) return LS.get('resp',[]).filter(r=>r.pesquisa_id===pesquisaId);
    const { data } = await sb.from('clima_respostas').select('*').eq('pesquisa_id',pesquisaId);
    return data||[];
  },
};

/* ====================================================================
   BANCO DE PERGUNTAS (inspirado nos "10 pilares" do TeamCulture,
   adaptado pra bar/restaurante). Cada uma é escala de carinha 1-5.
   O gerador local monta a pesquisa a partir do contexto/foco escolhido.
==================================================================== */
const PILARES = [
  { id:'lideranca',    nome:'Liderança',          emoji:'🧭', q:'Meu gerente/líder me trata com respeito e me dá apoio quando preciso.' },
  { id:'reconhecimento',nome:'Reconhecimento',    emoji:'🏅', q:'Quando faço um bom trabalho, isso é reconhecido aqui.' },
  { id:'ambiente',     nome:'Ambiente e colegas', emoji:'🤝', q:'Gosto de trabalhar com a minha equipe; o clima entre os colegas é bom.' },
  { id:'escala',       nome:'Escala e carga',     emoji:'🗓️', q:'Minha escala e carga de trabalho são justas e organizadas.' },
  { id:'remuneracao',  nome:'Remuneração',        emoji:'💰', q:'Sinto que sou pago(a) de forma justa pelo que entrego.' },
  { id:'comunicacao',  nome:'Comunicação',        emoji:'📣', q:'As informações importantes chegam até mim de forma clara.' },
  { id:'crescimento',  nome:'Crescimento',        emoji:'📈', q:'Vejo oportunidade de crescer e aprender trabalhando aqui.' },
  { id:'orgulho',      nome:'Orgulho',            emoji:'❤️', q:'Tenho orgulho de trabalhar aqui e recomendo a casa pra um amigo.' },
  { id:'condicoes',    nome:'Condições',          emoji:'🧰', q:'Tenho os equipamentos e condições que preciso pra fazer meu trabalho bem.' },
  { id:'seguranca',    nome:'Segurança',          emoji:'🛡️', q:'Me sinto seguro(a) e tratado(a) com dignidade no meu dia a dia.' },
];

// Gera perguntas a partir do contexto. Tenta a IA (edge function); se não houver,
// usa o banco local priorizando os focos escolhidos. SEMPRE retorna algo (demo-proof).
async function gerarPerguntas(contexto, focos, qtd){
  // 1) tenta IA real (fase 2)
  if (CFG.EDGE_IA_URL){
    try{
      const res = await fetch(CFG.EDGE_IA_URL, { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ acao:'gerar_perguntas', contexto, focos, qtd }) });
      if (res.ok){ const j = await res.json(); if (j.perguntas?.length) return j.perguntas; }
    }catch(e){ console.warn('IA off, usando gerador local', e); }
  }
  // 2) gerador local
  const ordenados = [...PILARES].sort((a,b)=>{
    const fa = focos.includes(a.id)?0:1, fb = focos.includes(b.id)?0:1; return fa-fb;
  });
  const out = ordenados.slice(0, Math.max(1, qtd-2)).map(p=>({ tipo:'escala', pilar:p.id, texto:p.q }));
  // sempre inclui eNPS + 1 pergunta aberta no final
  out.push({ tipo:'enps', pilar:'enps', texto:'De 0 a 10, o quanto você recomendaria trabalhar aqui pra um amigo?' });
  out.push({ tipo:'aberta', pilar:'aberta', texto:'Se você pudesse mudar UMA coisa aqui pra melhorar, o que seria?' });
  return out.slice(0, qtd);
}

/* ====================================================================
   ROUTER
==================================================================== */
function parseHash(){
  const h = (location.hash||'#/').replace(/^#/,'');
  const parts = h.split('/').filter(Boolean); // ['r','id','tok']
  return parts;
}
async function render(){
  const p = parseHash();
  const root = document.getElementById('root');
  root.className = 'min-h-screen';
  if (p[0]==='criar') return viewCriar(root);
  if (p[0]==='r')     return viewResponder(root, p[1], p[2]);
  if (p[0]==='dash')  return viewDashboard(root, p[1]);
  return viewHome(root);
}
window.addEventListener('hashchange', render);

/* ====================================================================
   HELPERS DE UI
==================================================================== */
function toast(msg){
  const t = document.getElementById('toast');
  t.querySelector('div').textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.add('hidden'), 2200);
}
function topbar(titulo, voltar){
  return `<header class="bg-gradient-to-r from-roxo-700 to-roxo-900 text-white">
    <div class="max-w-5xl mx-auto px-5 py-4 flex items-center gap-3">
      ${voltar?`<a href="${voltar}" class="w-9 h-9 grid place-items-center rounded-lg bg-white/15 hover:bg-white/25">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></a>`:`
      <div class="w-9 h-9 grid place-items-center rounded-lg bg-white/15 font-extrabold">B</div>`}
      <div class="leading-tight">
        <div class="font-extrabold text-[15px]">Botequim<span class="font-light opacity-80">Clima</span></div>
        <div class="text-[10px] opacity-60 uppercase tracking-wider">${titulo}</div>
      </div>
      ${CFG.MODO_DEMO?`<span class="ml-auto text-[10px] bg-aviso/90 text-white px-2 py-1 rounded-pill font-semibold">MODO DEMO</span>`:''}
    </div>
  </header>`;
}
const FACES = [
  { v:1, e:'😡', t:'Péssimo',  c:'#E74C3C' },
  { v:2, e:'🙁', t:'Ruim',     c:'#F39C12' },
  { v:3, e:'😐', t:'Neutro',   c:'#F1C40F' },
  { v:4, e:'🙂', t:'Bom',      c:'#52C41A' },
  { v:5, e:'😍', t:'Ótimo',    c:'#2ECC71' },
];

/* ====================================================================
   VIEW: HOME (admin)
==================================================================== */
async function viewHome(root){
  const lista = await DB.listarPesquisas();
  root.innerHTML = `
  ${topbar('Painel do dono')}
  <main class="max-w-5xl mx-auto px-5 py-7">
    <div class="flex items-center justify-between mb-5">
      <div>
        <h1 class="text-xl font-extrabold">Pesquisas de clima</h1>
        <p class="text-cinza-500 text-sm">Crie, mande o link no zap e acompanhe pelo celular.</p>
      </div>
      <a href="#/criar" class="bg-roxo-500 hover:bg-roxo-600 text-white font-semibold text-sm px-4 py-2.5 rounded-pill shadow-pop flex items-center gap-2">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Nova pesquisa
      </a>
    </div>
    ${lista.length===0 ? `
      <div class="bg-white rounded-card shadow-card p-10 text-center">
        <div class="text-5xl mb-3">📊</div>
        <p class="font-semibold">Nenhuma pesquisa ainda</p>
        <p class="text-cinza-500 text-sm mb-5">Crie a primeira em menos de 2 minutos.</p>
        <a href="#/criar" class="inline-block bg-roxo-500 text-white font-semibold text-sm px-5 py-2.5 rounded-pill">Criar primeira pesquisa</a>
      </div>` :
      `<div class="grid sm:grid-cols-2 gap-4">
        ${lista.map(p=>cardPesquisa(p)).join('')}
      </div>`}
  </main>`;
  // adesão por card
  for (const p of lista){
    const resp = await DB.listarRespostas(p.id);
    const el = document.getElementById('ades-'+p.id);
    if (el){ const tot=(p.funcionarios||[]).length||1; const pct=Math.round(resp.length/tot*100);
      el.textContent = `${resp.length}/${(p.funcionarios||[]).length} responderam (${pct}%)`; }
  }
}
function cardPesquisa(p){
  const st = { rascunho:['Rascunho','#7F8C8D'], aberta:['Aberta','#2ECC71'], fechada:['Fechada','#5A6473'] }[p.status]||['—','#999'];
  return `<div class="bg-white rounded-card shadow-card p-5">
    <div class="flex items-start justify-between">
      <div>
        <div class="text-[11px] uppercase tracking-wide text-cinza-500">${p.empresa||'—'}</div>
        <div class="font-bold text-[15px]">${p.titulo||'Pesquisa de clima'}</div>
      </div>
      <span class="text-[10px] font-bold px-2 py-1 rounded-pill" style="background:${st[1]}18;color:${st[1]}">${st[0]}</span>
    </div>
    <div id="ades-${p.id}" class="text-sm text-cinza-700 mt-3">—</div>
    <div class="flex gap-2 mt-4">
      <a href="#/dash/${p.id}" class="flex-1 text-center text-sm font-semibold bg-roxo-50 text-roxo-700 py-2 rounded-pill">Ver resultado</a>
      <button onclick="copiarLink('${p.id}')" class="flex-1 text-sm font-semibold bg-cinza-100 text-cinza-700 py-2 rounded-pill">Copiar link</button>
    </div>
  </div>`;
}
function linkPublico(id, token){
  const base = location.href.split('#')[0];
  return base + '#/r/' + id + (token?('/'+token):'');
}
async function copiarLink(id){
  const url = linkPublico(id);
  try{ await navigator.clipboard.writeText(url); toast('Link copiado! Cola no grupo do zap 👍'); }
  catch{ prompt('Copie o link:', url); }
}

/* ====================================================================
   VIEW: CRIAR (wizard)
==================================================================== */
const novo = { id:null, empresa:'', titulo:'', contexto:{tipo:'',descobrir:'',obs:''}, focos:[], qtd:6, perguntas:[], funcionarios:[], anonima:false, status:'rascunho' };
let W = null; // estado do wizard
let etapa = 1;

async function viewCriar(root){
  if(!W) W = JSON.parse(JSON.stringify(novo)), W.id = uid();
  root.innerHTML = `${topbar('Nova pesquisa','#/')}
  <main class="max-w-2xl mx-auto px-5 py-6">
    <div class="flex items-center gap-2 mb-6">
      ${[1,2,3,4,5].map(n=>`<div class="flex-1 h-1.5 rounded-pill ${n<=etapa?'bg-roxo-500':'bg-cinza-200'}"></div>`).join('')}
    </div>
    <div id="wstep" class="fade"></div>
  </main>`;
  renderEtapa();
}
function renderEtapa(){
  const c = document.getElementById('wstep');
  if(etapa===1) c.innerHTML = etapaEmpresa();
  if(etapa===2) c.innerHTML = etapaFuncionarios();
  if(etapa===3) c.innerHTML = etapaContexto();
  if(etapa===4) c.innerHTML = etapaPerguntas();
  if(etapa===5) c.innerHTML = etapaPublicar();
  c.classList.remove('fade'); void c.offsetWidth; c.classList.add('fade');
  if(etapa===2) renderListaFunc();
}
function navWizard(back, next, nextLabel){
  return `<div class="flex gap-3 mt-7">
    ${back?`<button onclick="${back}" class="px-5 py-3 rounded-pill bg-cinza-100 text-cinza-700 font-semibold text-sm">Voltar</button>`:''}
    <button onclick="${next}" class="flex-1 px-5 py-3 rounded-pill bg-roxo-500 hover:bg-roxo-600 text-white font-bold text-sm">${nextLabel}</button>
  </div>`;
}

// --- Etapa 1: empresa/casa
function etapaEmpresa(){
  return `<h2 class="text-lg font-extrabold mb-1">Qual casa vamos pesquisar?</h2>
  <p class="text-cinza-500 text-sm mb-5">Na reunião: o nome do bar/restaurante delas.</p>
  <label class="block text-sm font-semibold mb-1">Nome da casa</label>
  <input id="f-empresa" value="${W.empresa}" placeholder="Ex: Bar da Cida" class="w-full border border-cinza-200 rounded-card px-4 py-3 mb-4 focus:border-roxo-500 outline-none">
  <label class="block text-sm font-semibold mb-1">Título da pesquisa</label>
  <input id="f-titulo" value="${W.titulo||'Pesquisa de Clima'}" class="w-full border border-cinza-200 rounded-card px-4 py-3 focus:border-roxo-500 outline-none">
  ${navWizard(null, 'salvarEmpresa()', 'Continuar →')}`;
}
function salvarEmpresa(){
  W.empresa = document.getElementById('f-empresa').value.trim();
  W.titulo  = document.getElementById('f-titulo').value.trim() || 'Pesquisa de Clima';
  if(!W.empresa){ toast('Coloca o nome da casa 🙂'); return; }
  etapa=2; renderEtapa();
}

// --- Etapa 2: funcionários (o "efeito guardanapo")
function etapaFuncionarios(){
  return `<h2 class="text-lg font-extrabold mb-1">Quem vai responder?</h2>
  <p class="text-cinza-500 text-sm mb-4">Digite os nomes (1 por linha). Eles viram a lista clicável da pesquisa.
  O telefone é opcional — preencha pra mandar um <b>link individual</b> pra cada um (trava pra ninguém responder pelo outro).</p>
  <div class="bg-roxo-50 border border-roxo-100 rounded-card p-3 mb-4 text-[13px] text-roxo-800">
    💡 <b>Na reunião:</b> pergunte "quantas funcionárias são?" e digite os nomes do guardanapo aqui na frente delas.
  </div>
  <div class="flex gap-2 mb-2">
    <input id="f-nome" placeholder="Nome completo" class="flex-1 border border-cinza-200 rounded-card px-4 py-2.5 focus:border-roxo-500 outline-none" onkeydown="if(event.key==='Enter'){addFunc();}">
    <input id="f-tel" placeholder="(opcional) telefone" class="w-40 border border-cinza-200 rounded-card px-3 py-2.5 focus:border-roxo-500 outline-none" onkeydown="if(event.key==='Enter'){addFunc();}">
    <button onclick="addFunc()" class="bg-roxo-500 text-white font-bold px-4 rounded-card">+</button>
  </div>
  <textarea id="f-bulk" rows="2" placeholder="Ou cole vários nomes de uma vez (1 por linha) e clique em Adicionar lista" class="w-full border border-cinza-200 rounded-card px-4 py-2.5 text-sm mb-2 focus:border-roxo-500 outline-none"></textarea>
  <button onclick="addBulk()" class="text-roxo-600 text-sm font-semibold mb-4">+ Adicionar lista colada</button>
  <div id="lista-func"></div>
  ${navWizard('etapaBack(1)', 'salvarFunc()', 'Continuar →')}`;
}
function renderListaFunc(){
  const el = document.getElementById('lista-func'); if(!el) return;
  if(W.funcionarios.length===0){ el.innerHTML = `<div class="text-cinza-500 text-sm py-3 text-center border border-dashed border-cinza-200 rounded-card">Nenhum nome ainda</div>`; return; }
  el.innerHTML = `<div class="text-xs text-cinza-500 mb-2">${W.funcionarios.length} pessoa(s)</div>
  <div class="space-y-2">${W.funcionarios.map(f=>`
    <div class="flex items-center gap-2 bg-white border border-cinza-200 rounded-card px-3 py-2">
      <div class="w-8 h-8 rounded-pill bg-roxo-100 text-roxo-700 grid place-items-center font-bold text-sm">${(f.nome[0]||'?').toUpperCase()}</div>
      <div class="flex-1"><div class="font-semibold text-sm">${f.nome}</div>
        ${f.telefone?`<div class="text-[11px] text-cinza-500">${f.telefone} · link individual</div>`:`<div class="text-[11px] text-cinza-400">sem telefone · usa link geral</div>`}</div>
      <button onclick="rmFunc('${f.id}')" class="text-cinza-400 hover:text-alerta">✕</button>
    </div>`).join('')}</div>`;
}
function addFunc(){
  const n = document.getElementById('f-nome'), t = document.getElementById('f-tel');
  const nome = n.value.trim(); if(!nome) return;
  W.funcionarios.push({ id:uid(), empresa:W.empresa, nome, telefone:t.value.trim(), token:tok() });

let R = { pesquisa:null, func:null, idx:0, respostas:{}, comentarios:{}, concordou:false };

  const p = await DB.getPesquisa(id);

function renderPergunta(){
  const q = R.pesquisa.perguntas[R.idx];
  const total = R.pesquisa.perguntas.length;
  const body = document.getElementById('rbody');
  // caixinha opcional pra escrever mais (alimenta a análise da IA)
  const cbox = `<textarea id="r-coment" rows="2" placeholder="✍️ Quer escrever um pouco mais? (opcional) — depois toque na resposta" class="w-full border border-cinza-200 rounded-card px-3 py-2 text-sm mt-4 focus:border-roxo-500 outline-none">${R.comentarios[R.idx]||''}</textarea>`;

    </div>
    <div class="flex justify-between text-[11px] text-cinza-400 mt-2"><span>0 — não recomendo</span><span>10 — recomendo muito</span></div>${cbox}`;
  } else {
    input = `<textarea id="r-aberta" rows="4" placeholder="Escreva aqui (opcional)…" class="w-full border border-cinza-200 rounded-card px-4 py-3 mt-5 focus:border-roxo-500 outline-none">${R.respostas[R.idx]||''}</textarea>
      <button onclick="responder(document.getElementById('r-aberta').value)" class="w-full bg-roxo-500 text-white font-bold py-3.5 rounded-pill mt-4">${R.idx+1<total?'Próxima':'Enviar respostas'}</button>`;
  }
  body.innerHTML = `

async function responder(val){
  const cm = document.getElementById('r-coment');
  if(cm) R.comentarios[R.idx] = cm.value.trim();
  R.respostas[R.idx] = val;
  const total = R.pesquisa.perguntas.length;
  if(R.idx+1 < total){ R.idx++; renderPergunta(); return; }
  // fim — monta e salva
  const itens = R.pesquisa.perguntas.map((q,i)=>({ pilar:q.pilar, tipo:q.tipo, valor:R.respostas[i] ?? null, comentario:R.comentarios[i]||null }));
  await DB.salvarResposta({
    id: uid(), pesquisa_id: R.pesquisa.id,
    func_id: R.pesquisa.anonima ? null : (R.func?.id||null),
    func_nome: R.pesquisa.anonima ? null : (R.func?.nome||null),
    itens, criado_em: Date.now ? Date.now() : 0,
  });
  document.getElementById('rbody').innerHTML = telaInfo('Prontinho! Obrigado por responder 💜<br>Sua opinião faz diferença.','🎉');
}

function metricas(p, resp){
  const total = (p.funcionarios||[]).length||0;
  const adesao = total? Math.round(resp.length/total*100) : (resp.length?100:0);
  // escala por pilar
  const byPilar = {};
  let enpsVals = [], comentarios = [];
  resp.forEach(r=>(r.itens||[]).forEach(it=>{
    if(it.tipo==='escala' && typeof it.valor==='number'){ (byPilar[it.pilar] ??= []).push(it.valor); }
    if(it.tipo==='enps' && typeof it.valor==='number'){ enpsVals.push(it.valor); }
    if(it.tipo==='aberta' && it.valor && String(it.valor).trim()){ comentarios.push(String(it.valor).trim()); }
    // comentário opcional embaixo de qualquer pergunta
    if(it.comentario && String(it.comentario).trim()){ comentarios.push(String(it.comentario).trim()); }
  }));
  const pilares = Object.entries(byPilar).map(([id,vals])=>{
    const meta = PILARES.find(x=>x.id===id)||{nome:id,emoji:'•'};
    const media = vals.reduce((a,b)=>a+b,0)/vals.length;
    const cor = media>=4?'#2ECC71':media>=3?'#F39C12':'#E74C3C';
    return { id, nome:meta.nome, emoji:meta.emoji, media, cor };
  }).sort((a,b)=>a.media-b.media);
  // eNPS = %promotores(9-10) - %detratores(0-6)
  let enps=null, enpsLabel='—', enpsCor='#7F8C8D';
  if(enpsVals.length){
    const prom = enpsVals.filter(v=>v>=9).length, det = enpsVals.filter(v=>v<=6).length;
    enps = Math.round((prom-det)/enpsVals.length*100);
    enpsLabel = enps>=50?'Excelente': enps>=0?'Bom': enps>=-50?'Ruim':'Crítico';
    enpsCor = enps>=50?'#2ECC71': enps>=0?'#52C41A': enps>=-50?'#F39C12':'#E74C3C';
  }
  const todasEscalas = Object.values(byPilar).flat();
  const climaMedia = todasEscalas.length? todasEscalas.reduce((a,b)=>a+b,0)/todasEscalas.length : null;
  const climaEmoji = climaMedia? (FACES.find(f=>f.v===Math.round(climaMedia))||FACES[2]).e : '—';
  return { adesao, pilares, enps, enpsLabel, enpsCor, climaMedia, climaEmoji, comentarios };
}
async function montarLeituraIA(p, m){
  const box = document.getElementById('ia-box'); if(!box) return;
  // tenta IA real
  if(CFG.EDGE_IA_URL){
    try{
      const res = await fetch(CFG.EDGE_IA_URL,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({acao:'resumir', empresa:p.empresa, metricas:m})});
      if(res.ok){ const j=await res.json(); if(j.texto){ box.innerHTML=j.texto; return; } }
    }catch(e){ /* cai pro local */ }
  }
  // leitura local (regras simples mas úteis)
  box.innerHTML = leituraLocal(m);
}
function leituraLocal(m){
  const partes = [];
  if(m.enps!=null) partes.push(`eNPS <b>${m.enps}</b> (${m.enpsLabel.toLowerCase()}).`);
  if(m.pilares.length){
    const pior = m.pilares[0], melhor = m.pilares[m.pilares.length-1];
    partes.push(`Ponto mais fraco: <b>${pior.nome}</b> (${pior.media.toFixed(1)}/5). Mais forte: <b>${melhor.nome}</b>.`);
    // ação sugerida pelo pior pilar
    const acoes = {
      lideranca:'converse 1:1 com a liderança dessa equipe nesta semana.',
      reconhecimento:'crie um "destaque da semana" simples pra reconhecer quem se esforça.',
      ambiente:'promova um momento de equipe (um café/lanche juntos) e ouça os atritos.',
      escala:'revise a escala — provavelmente tem gente sobrecarregada em dias específicos.',
      remuneracao:'avalie a política de gorjeta/extra; comunique claramente como funciona.',
      comunicacao:'crie um mural ou grupo só de avisos importantes pra todos verem.',
      crescimento:'mostre um caminho de crescimento (ex: auxiliar → garçom → líder).',
      condicoes:'liste com a equipe o que está faltando de equipamento/insumo e resolva o top 3.',
      seguranca:'reforce regras de respeito e um canal seguro pra reclamar sem medo.',
    };
    if(acoes[pior.id]) partes.push(`👉 <b>Ação sugerida:</b> ${acoes[pior.id]}`);
  }
  if(m.comentarios.length) partes.push(`${m.comentarios.length} pessoa(s) deixaram comentário aberto — vale ler abaixo.`);
  return partes.join(' ') || 'Poucas respostas pra uma leitura confiável. Aguarde mais gente responder.';
}

render();
